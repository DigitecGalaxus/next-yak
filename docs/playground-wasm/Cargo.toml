[package]
name = "playground-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
# required by the swc macros; should not be enabled
__plugin = []

[dependencies]
anyhow = "1.0.104"
console_error_panic_hook = "0.1.7"
js-sys = "0.3.104"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = { version = "0.6.5" }
# enable the js flag for the getrandom transitive dependency
# (pinned to 0.3 so it unifies with the copy pulled in via swc_core/ahash;
# a wider range would resolve to a newer major and split the dependency,
# leaving the transitive copy without the wasm_js feature)
getrandom = { version = "0.3", features = ["wasm_js"] }
# Keep in sync with swc_core in packages/yak-swc/Cargo.toml
swc_core = { version = "=75.0.0", features = [
  "ecma_ast_serde",
  "binding_macro_wasm",
  "ecma_transforms_module",
  "base_module",
] }
wasm-bindgen = "0.2.127"
# `tsify` generates the TypeScript type of the plugin config (YakConfig)
yak_swc = { version = "0.1.0", path = "../../packages/yak-swc/yak_swc", default-features = false, features = [
  "tsify",
] }
either = "1.18.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.77"

# Its own workspace, so the compiler crates stay out of the lockfile of the yak-swc plugin
[workspace]

[profile.release]
# The same size-first settings as the yak-swc workspace
strip = "debuginfo"
codegen-units = 1
lto = true
opt-level = "z"
