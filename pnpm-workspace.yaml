packages:
  - packages/*
  - examples/*
  - benchmarks
  - e2e
  - e2e/bundlers/*

overrides:
  "@yak/swc": workspace:*
  # Every copy of @swc/core in the workspace must stay on the ABI line the
  # yak-swc wasm plugin is built for (see the core catalog). Storybook's
  # webpack builder runs the plugin through its own swc-loader, so a second,
  # newer @swc/core would break it.
  "@swc/core": catalog:core

# Only install versions published at least a day ago
minimumReleaseAge: 1440

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true

catalogs:
  core:
    "@babel/parser": ^8.0.4
    "@oxlint/plugins": ^1.81.0
    "@solidjs/web": ^2.0.0-rc.10
    # qwik 2 beta: pinned, the betas move every one to three weeks
    "@qwik.dev/core": 2.0.0-beta.47
    # Keep in sync with swc_core in packages/yak-swc/Cargo.toml and next.js version of bundled SWC
    "@swc/core": ~1.15.47
    "@swc/counter": ^0.1.3
    solid-js: ^2.0.0-rc.10
  dev:
    "@babel/types": 8.0.6
    "@rsbuild/core": 2.2.2
    "@rsbuild/plugin-react": 2.1.0
    "@changesets/cli": 3.0.1
    "@next/eslint-plugin-next": 16.3.4
    "@playwright/test": 1.62.1
    "@storybook/addon-docs": 10.6.0
    "@storybook/addon-webpack5-compiler-swc": 4.0.3
    "@storybook/react": 10.6.0
    "@storybook/react-vite": 10.6.0
    "@storybook/react-webpack5": 10.6.0
    "@tanstack/react-router": 1.170.32
    "@tanstack/react-start": 1.168.49
    "@testing-library/dom": 10.4.1
    "@testing-library/react": 16.3.3
    "@types/benchmark": 2.1.5
    "@types/jest": 30.0.0
    "@types/node": 26.4.1
    "@types/react": 19.2.18
    "@types/react-dom": 19.2.5
    "@types/webpack": 5.28.5
    "@typescript-eslint/parser": 8.69.0
    "@typescript-eslint/rule-tester": 8.69.0
    "@vitejs/plugin-react": 6.1.1
    "@vitejs/plugin-react-swc": 4.3.3
    "@vitejs/plugin-rsc": 0.5.34
    benchmark: 2.1.4
    eslint: 10.9.1
    eslint-config-next: 16.3.4
    eslint-doc-generator: 3.7.1
    jest: 30.5.1
    "@testing-library/jest-dom": 7.0.1
    jest-environment-jsdom: 30.5.1
    jsdom: 30.0.1
    knip: 6.34.0
    next: 16.3.4
    oxfmt: 0.66.0
    oxlint: 1.81.0
    # postcss-nested 8 is ESM-only. Next.js loads postcss plugins for webpack
    # via `require(name)(options)`, which cannot consume that (Turbopack is fine),
    # so the Next.js example stays on 7.x until Next handles ESM plugins.
    postcss-nested: 7.0.2
    react: 19.2.8
    react-dom: 19.2.8
    storybook: 10.6.0
    styled-components: 6.5.3
    tsdown: 0.22.14
    # TypeScript 7 (the native compiler) ships no programmatic API yet, which
    # typescript-eslint, twoslash and the dts bundler need, so stay on 6.x.
    typescript: 6.0.3
    vinext: 1.0.0-beta.9
    vite: 8.2.2
    "@solidjs/vite-plugin": 3.0.0-next.46
    vitest: 4.1.11
