packages:
  - packages/*
  - examples/*
  - benchmarks
  - docs
  - e2e
  - e2e/bundlers/*

overrides:
  "@yak/swc": workspace:*
  # Every copy of @swc/core in the workspace must stay on the ABI line the
  # yak-swc wasm plugin is built for (see the core catalog). Storybook's
  # webpack builder runs the plugin through its own swc-loader, so a second,
  # newer @swc/core would break it.
  "@swc/core": catalog:core
  # Types for the docs playground editor (the editor itself loads from a CDN).
  # @monaco-editor/react 4.7 imports `monaco-editor/esm/vs/editor/editor.api`,
  # which the export map of 0.55 and later does not resolve.
  monaco-editor: 0.54.0

# Only install versions published at least a day ago
minimumReleaseAge: 1440

allowBuilds:
  "@parcel/watcher": false
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  wasm-pack: true

catalogs:
  core:
    "@babel/parser": ^8.0.7
    "@oxlint/plugins": ^1.88.0
    "@solidjs/web": ^2.0.0-rc.15
    # Keep in sync with swc_core in packages/yak-swc/Cargo.toml and next.js version of bundled SWC
    "@swc/core": ~1.16.18
    "@swc/counter": ^0.1.3
    solid-js: ^2.0.0-rc.15
  dev:
